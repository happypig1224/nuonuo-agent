spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/nuonuo_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:nuonuo_root}
    password: ${SPRING_DATASOURCE_PASSWORD:YourSecurePassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:YourRedisPassword123!}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 3s

nuonuo:
  llm:
    base-url: ${LLM_BASE_URL:https://api.302.ai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    fallback-model: ${LLM_FALLBACK_MODEL:gpt-3.5-turbo}
